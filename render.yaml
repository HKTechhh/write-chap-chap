# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Free-tier deployment: Postgres, the Django API, and the React static site.
#
# There is deliberately NO Redis and NO Celery worker here. Render has no free
# background workers, and a broker without a worker is worse than no broker at
# all — `task.delay()` would succeed, queue the job, and nothing would ever
# consume it, so screening would silently never run. Instead the API sets
# CELERY_TASK_ALWAYS_EAGER=True, which makes tasks execute inline on the
# request. To move to real background processing, see "SCALING UP" at the
# bottom of this file.

databases:
  - name: wcc-db
    databaseName: writechapchap
    user: writechapchap
    plan: free
    # MUST match the region of wcc-api below. Render's internal database
    # hostname (dpg-xxxx-a) only resolves within a single region's private
    # network, so a database left in the default region makes `migrate` fail
    # at build time with "could not translate host name".
    region: frankfurt

services:
  # ------------------------------------------------------------ Django API
  - type: web
    name: wcc-api
    runtime: python
    plan: free
    region: frankfurt # closest Render region to Kenya
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /api/check-requests/pricing/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true # Render generates and stores a strong secret
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wcc-db
          property: connectionString
      # No worker on the free plan: run queued tasks inline instead of
      # dropping them into a queue nothing is reading.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # Literal, not `fromService`. wcc-web already references wcc-api for
      # VITE_API_BASE_URL, and Render cannot resolve a cycle — whichever side
      # builds first sees a service that has no URL yet and silently gets an
      # empty string. Hardcoding both directions is uglier but deterministic.
      # Change these two URLs together if you rename the services.
      - key: FRONTEND_URL
        value: https://wcc-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://wcc-web.onrender.com
      # Demo data is seeded on first build so the site isn't an empty shell.
      # Set this to False (and delete the demo users) before real traffic —
      # they all share a password published in the README.
      - key: SEED_DEMO
        value: "True"
      # --- optional integrations: fill in via the dashboard when ready ---
      - key: GPTZERO_API_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: WHATSAPP_SUPPORT_NUMBER
        sync: false
      # --- S3-compatible media storage ---
      # Render's disk is ephemeral: without these, every uploaded deliverable,
      # KYC document and dispute attachment is wiped on each redeploy.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false

  # -------------------------------------------------------- React frontend
  - type: web
    name: wcc-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # Baked into the JS bundle at BUILD time, so it must already be correct
      # when the static site builds. `fromService` resolved to an empty string
      # on the first deploy because wcc-api had no URL yet, which shipped a
      # bundle calling relative /api/... — those hit the SPA rewrite below and
      # returned index.html instead of JSON, so every request failed to parse.
      - key: VITE_API_BASE_URL
        value: https://wcc-api-5mhu.onrender.com
      - key: VITE_WHATSAPP_NUMBER
        sync: false
    routes:
      # SPA fallback: every non-asset path must serve index.html so deep links
      # like /orders/12 survive a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
# ---------------------------------------------------------------------------
# SCALING UP — enabling real background processing
#
# What you're missing without a worker:
#   * escrow does not auto-release after the 72h review window
#   * late-delivery fines are never applied
#   * writer tiers are not recalculated nightly
# (Screening still runs — it just happens inline on upload rather than async.)
#
# To enable it, add a Key Value instance and two workers, then REMOVE the
# CELERY_TASK_ALWAYS_EAGER env var from wcc-api above:
#
#   - type: keyvalue          # Render's managed Redis-compatible store
#     name: wcc-redis
#     plan: starter
#     maxmemoryPolicy: noeviction   # Celery must not lose queued tasks
#     ipAllowList: []               # internal-only, not exposed publicly
#
#   - type: worker
#     name: wcc-worker
#     runtime: python
#     plan: starter
#     rootDir: backend
#     buildCommand: "pip install -r requirements.txt"
#     startCommand: "celery -A config worker --loglevel=info --concurrency=2"
#     envVars: [ same DATABASE_URL / SECRET_KEY / CELERY_BROKER_URL as the API ]
#
#   - type: worker
#     name: wcc-beat
#     runtime: python
#     plan: starter
#     rootDir: backend
#     buildCommand: "pip install -r requirements.txt"
#     startCommand: "celery -A config beat --loglevel=info"
#     envVars: [ same as wcc-worker ]
#
# Both workers need CELERY_BROKER_URL and CELERY_RESULT_BACKEND pointing at
# wcc-redis via `fromService: { name: wcc-redis, type: keyvalue,
# property: connectionString }`.
# ---------------------------------------------------------------------------
