<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Write Chap Chap — hire vetted writers or earn as one. Money held in escrow, every delivery screened for AI content and plagiarism, deadlines enforced."
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Write Chap Chap — Freelance writing, done properly</title>
    <script>
      // Runs before first paint so a dark-mode user never sees a white flash
      // while the JS bundle loads. React re-applies the same class on mount.
      // Key must match THEME_STORAGE_KEY in src/context/ThemeContext.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem('wcc.theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {
          /* Storage blocked — light mode is a safe default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
